<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f6bed">
<title>البرمجة والذكاء الاصطناعي | منصة QUR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#2f6bed;--blue2:#5b8cff;--pur:#7c3aed;--pur2:#a78bfa;--ink:#1a2444;--mut:#64708f;--bg:#f4f6fc;--line:#e4e9f7;--ok:#15a05a;--okbg:#e9f9f0;--bad:#e0404e;--badbg:#fdeeee;--sh:0 8px 28px rgba(38,60,140,.09)}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.75;padding-bottom:70px}
h1,h2,h3,h4{font-family:'Cairo',sans-serif;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
::selection{background:#dcdcfd}

/* ===== شريط علوي ===== */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(30,50,120,.05)}
.tbar{max-width:1120px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0}
.logo{font-family:'Cairo';font-weight:900;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--pur));padding:4px 14px;border-radius:12px;letter-spacing:1px}
.btxt{display:flex;flex-direction:column;text-align:right;line-height:1.3}
.btxt b{font-family:'Cairo';font-size:14px}
.btxt small{color:var(--mut);font-size:11px}
.navlinks{display:flex;gap:4px;margin-inline-start:auto}
.nl{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px}
.nl:hover{background:#f0f3fc;color:var(--blue)}
.nl.on{background:#eef2ff;color:var(--blue)}
.nl svg{width:17px;height:17px}
.tchips{display:flex;gap:8px;align-items:center;margin-inline-start:auto}
.navlinks+.tchips{margin-inline-start:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 13px;font-weight:800;font-size:13px;color:var(--ink)}
.chip.blue{background:#eef4ff;border-color:#d5e2ff;color:var(--blue)}
.chip.pur{background:#f4efff;border-color:#e2d5ff;color:var(--pur)}
.chip.ok{background:var(--okbg);border-color:#c6ecd7;color:var(--ok)}
.chip.warn{background:#fff8e8;border-color:#f5e3b0;color:#a67c08}
.chip.who{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:15px;height:15px}

/* ===== تنقل سفلي للجوال ===== */
#bottomnav{display:none;position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);z-index:60;box-shadow:0 -4px 18px rgba(30,50,120,.08)}
#bottomnav .bnin{display:flex}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:0;background:none;color:var(--mut);font-size:11px;font-weight:700}
.bn svg{width:20px;height:20px}
.bn.on{color:var(--blue)}

/* ===== عام ===== */
.wrap{max-width:1120px;margin:auto;padding:20px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.pad{padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut)}
.small{font-size:13px}
.center{text-align:center}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:0;padding:11px 20px;font-weight:800;font-size:15px;background:#eef1fa;color:var(--ink);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;box-shadow:0 6px 18px rgba(80,90,230,.3)}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn.okb{background:var(--okbg);color:var(--ok);border:1.5px solid #c6ecd7}
.btn.danger{background:var(--badbg);color:var(--bad);border:1.5px solid #f6cfd2}
.btn.sm{padding:7px 14px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.pbar{height:10px;background:#e9edf9;border-radius:99px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--pur));border-radius:99px;transition:width .5s ease}

.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfcff;outline:none;transition:.15s}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,107,237,.12)}
textarea.inp{min-height:80px;resize:vertical}

.k{direction:ltr;display:inline-block;background:#eef2ff;border:1px solid #dbe4ff;border-radius:7px;padding:1px 8px;font-family:'JetBrains Mono',monospace;font-size:.9em;color:#3b4fd8}
.code{direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace;background:#101b36;color:#dbe6ff;padding:14px 16px;border-radius:14px;overflow-x:auto;font-size:13.5px;line-height:1.9;border:1px solid #1d2c55;margin:8px 0;position:relative}
.code:before{content:'CODE';position:absolute;top:8px;inset-inline-end:12px;font-size:9px;color:#5c6fa8;letter-spacing:2px;font-family:'Cairo'}
.out{background:#0a1226;border:1px dashed #33437a;color:#7ee2a8}

/* ===== واجهة الترحيب ===== */
.hero{background:linear-gradient(135deg,#12235c 0%,#20358f 45%,#5b34b8 100%);color:#fff;border:0;overflow:hidden;position:relative}
.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.14),transparent 40%),radial-gradient(circle at 10% 90%,rgba(167,139,250,.25),transparent 45%)}
.hero>*{position:relative}
.hero .big{font-family:'Cairo';font-weight:900;font-size:clamp(26px,4.5vw,42px);margin:8px 0 2px}
.hero .tag{color:#cdd8ff;font-size:15px}
.hero .en{color:#8fa0e8;letter-spacing:4px;font-size:11px;font-family:'Cairo'}
.hero .codes{font-family:'JetBrains Mono',monospace;color:#7fd4a8;font-size:12px;direction:ltr;text-align:left;opacity:.85}
.feature{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px 10px;text-align:center;font-weight:700;font-size:13px}
.tname{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.tavatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f5b942,#e88b2d);display:flex;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:17px;color:#3a2606;flex-shrink:0}
.phonechip{background:#12a35c;border-radius:99px;padding:4px 14px;font-weight:800;font-size:14px;direction:ltr;display:inline-flex;align-items:center;gap:7px}

/* ===== الوحدات والدروس ===== */
.unit{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:12px}
.uhead{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:0;text-align:right}
.uhead:hover{background:#f8faff}
.uico{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#eef4ff,#f4efff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.uhead b{font-family:'Cairo';font-size:15.5px}
.uhead small{display:block;color:var(--mut);font-weight:500;font-size:12.5px}
.uarrow{margin-inline-start:auto;color:var(--mut);transition:.2s}
.unit.open .uarrow{transform:rotate(180deg)}
.ubody{display:none;border-top:1px solid var(--line);background:#fafbff}
.unit.open .ubody{display:block}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lic{width:38px;height:38px;border-radius:10px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lmeta{flex:1;min-width:160px}
.lmeta b{font-size:14.5px}
.lstats{display:flex;gap:5px;margin-top:2px}
.st{font-size:11px;font-weight:800;padding:1px 9px;border-radius:99px;background:#eef1fa;color:var(--mut)}
.st.done{background:var(--okbg);color:var(--ok)}
.lbtns{display:flex;gap:7px;flex-wrap:wrap}

/* ===== صفحة الدرس ===== */
.crumb{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;gap:4px;margin-top:8px}
.seg .sg{flex:1;text-align:center;font-size:11.5px;font-weight:800;color:var(--mut);background:#eef1fa;border-radius:8px;padding:5px 4px}
.seg .sg.on{background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff}
.sec{padding:18px 20px;margin-bottom:14px}
.sec>h3{display:flex;align-items:center;gap:9px;font-size:17px;margin-bottom:12px;color:var(--blue)}
.sec>h3 .sico{width:32px;height:32px;border-radius:9px;background:#eef4ff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sec>h3 .sico svg{width:17px;height:17px}
.sec.pur>h3{color:var(--pur)}
.sec.pur>h3 .sico{background:#f4efff}
.steps{counter-reset:st}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border-bottom:0}
.snum{counter-increment:st;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.snum:before{content:counter(st)}
.rule{display:flex;gap:10px;align-items:flex-start;background:#f6f8ff;border:1px solid #e3e9fd;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.rule svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;margin-top:5px}
.exmp{border:1.5px solid #e3e9fd;border-radius:14px;padding:14px;margin-bottom:12px;background:#fcfdff}
.exmp>b{color:var(--pur);font-family:'Cairo';font-size:14px}
.exout{background:#0a1226;border:1px dashed #33437a;color:#7ee2a8;border-radius:10px;padding:8px 14px;direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:8px}
.mis{display:flex;gap:10px;background:#fff8f0;border:1px solid #f7e3c8;border-radius:12px;padding:10px 14px;margin-bottom:8px}
.mis svg{width:16px;height:16px;color:#d97706;flex-shrink:0;margin-top:5px}
.qq{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.qq-q{font-weight:700;margin-bottom:8px}
.qq-a{background:var(--okbg);border-radius:10px;padding:10px 14px;margin-top:8px;border:1px solid #c6ecd7;font-size:14px}
.warnbox{background:#fffbe9;border:1.5px solid #f3e3a6;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}

/* ===== الاختبار ===== */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qdots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 14px}
.qdots span{width:22px;height:6px;border-radius:99px;background:#e2e7f6}
.qdots span.on{background:var(--blue)}
.qdots span.okd{background:var(--ok)}
.qdots span.badd{background:var(--bad)}
.qtype{font-size:11.5px;font-weight:800;color:var(--pur);background:#f4efff;border:1px solid #e2d5ff;border-radius:99px;padding:3px 12px}
.qq2{font-family:'Cairo';font-weight:800;font-size:17px;margin:10px 0}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{text-align:right;border:1.5px solid var(--line);border-radius:13px;padding:12px 15px;background:#fff;font-size:15px;font-weight:600;transition:.12s}
.opt:hover{border-color:var(--blue2)}
.opt.sel{border-color:var(--blue);background:#eef4ff;box-shadow:0 0 0 3px rgba(47,107,237,.1)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.lock{pointer-events:none}
.tfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tfbtn{border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:17px;font-weight:800;background:#fff}
.tfbtn.sel{border-color:var(--blue);background:#eef4ff}
.tfbtn.ok{border-color:var(--ok);background:var(--okbg)}
.tfbtn.bad{border-color:var(--bad);background:var(--badbg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 18px;font-weight:800;font-size:14px}
.fchip.sel{border-color:var(--blue);background:#eef4ff}
.fchip.ok{border-color:var(--ok);background:var(--okbg)}
.fchip.bad{border-color:var(--bad);background:var(--badbg)}
.blank{display:inline-block;min-width:80px;border-bottom:2.5px dashed var(--pur);color:var(--pur);font-weight:800;text-align:center;padding:0 8px}
.oitem{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.oitem.ok{border-color:var(--ok);background:var(--okbg)}
.oitem.bad{border-color:var(--bad);background:var(--badbg)}
.oitem.dragover{border-color:var(--blue);border-style:dashed}
.onum{width:26px;height:26px;border-radius:50%;background:#eef1fa;color:var(--mut);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.obtns{margin-inline-start:auto;display:flex;gap:5px}
.obtns button{border:1px solid var(--line);background:#f7f9ff;border-radius:8px;width:30px;height:28px;font-size:12px}
.mzone{border:2px dashed #c9d4f2;border-radius:12px;padding:8px 12px;min-height:52px;display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#fafbff}
.mzone.ok{border-color:var(--ok);background:var(--okbg)}
.mzone.bad{border-color:var(--bad);background:var(--badbg)}
.mzone .zlab{font-weight:800;color:var(--mut);font-size:13px;flex-shrink:0}
.mchip{display:inline-flex;border:1.5px solid var(--blue);background:#eef4ff;color:var(--blue);border-radius:10px;padding:6px 14px;font-weight:800;cursor:grab;user-select:none}
.mchip.sel{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,107,237,.35)}
.mchip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.mchip.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fb{border-radius:13px;padding:13px 16px;margin-top:14px;font-size:14.5px;border:1.5px solid}
.fb.ok{background:var(--okbg);border-color:#bfe8d2}
.fb.bad{background:var(--badbg);border-color:#f2ccd0}
.fb b.t1{display:flex;align-items:center;gap:8px;font-family:'Cairo';margin-bottom:5px}
.fb.ok .t1{color:var(--ok)}.fb.bad .t1{color:var(--bad)}
.fb .corr{background:#ffffff88;border-radius:9px;padding:6px 12px;margin:6px 0;font-size:14px}
.fbxp{font-size:12.5px;font-weight:800;color:var(--pur)}

/* ===== النتائج ===== */
.ring{position:relative;width:130px;height:130px;margin:auto}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cairo';font-weight:900;font-size:28px}
.ring .rv small{font-size:11px;color:var(--mut);font-weight:700}
.stat{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{font-family:'Cairo';font-size:21px;display:block}
.stat small{color:var(--mut);font-size:12.5px}
.skillchip{background:#fff4f4;border:1.5px solid #f6cfd2;color:var(--bad);border-radius:99px;padding:5px 15px;font-weight:800;font-size:13px}
.motiv{background:linear-gradient(135deg,#eef4ff,#f4efff);border:1.5px dashed #c9d4f2;border-radius:14px;padding:13px 16px;font-weight:700;text-align:center}

/* ===== المتصدرون والجداول ===== */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:#f2f5fd;color:var(--mut);font-size:12.5px;padding:10px 8px;text-align:right}
.tb td{padding:11px 8px;border-top:1px solid var(--line)}
.tb tr.me{background:#f4efff}
.medal{font-size:20px}
.rank{font-family:'Cairo';font-weight:900;color:var(--mut);width:34px}
.tscroll{overflow-x:auto}

/* ===== الشهادة ===== */
.cert{background:linear-gradient(160deg,#ffffff,#f3efff 60%,#eef4ff);border:1px solid #d9c9f5;border-radius:8px;max-width:860px;margin:auto;aspect-ratio:1.45;display:flex;padding:10px;box-shadow:var(--sh)}
.cert-in{border:3px double var(--pur);border-radius:6px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 26px;gap:6px;position:relative;background:radial-gradient(circle at 50% 0%,rgba(124,58,237,.06),transparent 55%)}
.cert-top{display:flex;gap:12px;align-items:center}
.cert-logo{font-family:'Cairo';font-weight:900;background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;border-radius:10px;padding:2px 14px;font-size:18px}
.cert-plat{color:var(--mut);font-size:12px;font-weight:700}
.cert h2{font-size:clamp(20px,3.4vw,30px);color:var(--pur);letter-spacing:2px}
.cert-sub{color:var(--mut);font-size:13px}
.cert-name{font-family:'Cairo';font-weight:900;font-size:clamp(20px,4vw,34px);color:var(--blue);border-bottom:2.5px solid #f0b429;padding:0 26px 4px}
.cert p{font-size:13.5px}
.cert-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--mut)}
.cert-row b{color:var(--ink)}
.cert-foot{display:flex;gap:26px;align-items:center;margin-top:8px;flex-wrap:wrap;justify-content:center}
.cert-foot b{font-family:'Cairo';display:block}
.cert-foot small{color:var(--mut);font-size:11px}
.cert-seal{width:58px;height:58px;border:2.5px double #b794e8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pur);font-size:24px;font-weight:900;transform:rotate(-8deg)}
#certPrint{display:none}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body>*:not(#certPrint){display:none!important}
 #certPrint{display:block!important}
 #certPrint .cert{width:100%;max-width:none;aspect-ratio:auto;height:185mm}
}

/* ===== الإنجازات والمودال ===== */
#modal-root{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,52,.5);backdrop-filter:blur(3px)}
#modal-root.show{display:flex}
.mcard{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;animation:fade .25s ease}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;filter:grayscale(1);opacity:.5}
.badge.got{filter:none;opacity:1;border-color:#f0d789;background:#fffbef}
.badge .bico{font-size:30px}
.badge b{display:block;font-family:'Cairo';font-size:13.5px;margin-top:4px}
.badge small{color:var(--mut);font-size:11px}

#toast{position:fixed;bottom:88px;inset-inline:0;display:flex;justify-content:center;z-index:200;pointer-events:none}
.tmsg{background:#1c2a52;color:#fff;border-radius:99px;padding:11px 24px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(10,20,60,.4);animation:fade .3s ease;max-width:92vw;text-align:center}

/* ===== لوحة المعلم ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:800;font-size:13.5px;color:var(--mut)}
.tab.on{background:linear-gradient(135deg,var(--blue),var(--pur));color:#fff;border-color:transparent}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qrow .qt{flex:1;min-width:200px;font-size:13.5px;font-weight:600}
.ttype{font-size:10.5px;font-weight:800;border-radius:99px;padding:2px 10px;white-space:nowrap}
.tt-mcq{background:#eef4ff;color:var(--blue)}.tt-tf{background:#f4efff;color:var(--pur)}.tt-fill{background:#e9f9f0;color:var(--ok)}.tt-input{background:#fff8e8;color:#a67c08}.tt-order{background:#fdeeee;color:var(--bad)}.tt-match{background:#e8f7fb;color:#0e7f96}
.setrow{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.setrow label{font-weight:800;font-size:13px;display:block;margin-bottom:5px}
.setrow .inp{width:130px}
footer.appf{max-width:1120px;margin:26px auto 10px;padding:14px 16px;text-align:center;color:var(--mut);font-size:13px}
footer.appf b{color:var(--ink)}

@media(max-width:860px){
 .navlinks{display:none}
 #bottomnav{display:block}
 .grid4{grid-template-columns:1fr 1fr}
 .grid3{grid-template-columns:1fr}
 .grid2{grid-template-columns:1fr}
 .tchips .who{display:none}
 body{padding-bottom:76px}
 #toast{bottom:96px}
}
@media(max-width:480px){.lbtns{width:100%}.lbtns .btn{flex:1}}

ex:[
{t:'مثال 1: متغير عدد الأسماك',c:'let fish;\nfish = 0;\nfish = fish + 8;\nfish = fish + 12;\nconsole.log(fish);',o:'20',e:'بدأنا بـ 0 ثم أضفنا 8 ثم 12، والنتيجة 20 لأن 0 + 8 + 12 = 20.'}],
mis:['نسيان كلمة let عند تعريف المتغير لأول مرة.','كتابة console.log("fish"); فتطبع كلمة fish وليس قيمته — نكتب الاسم بدون اقتباس.','نسيان تساوي الإسناد = عند إعطاء القيمة.'],
quick:[
{q:'ما الكلمة المستخدمة لتعريف متغير؟',a:'الكلمة let ثم اسم المتغير.'},
{q:'إلى ماذا يشبه المتغير؟',a:'يشبه "علبة" أو "صندوق صغير" نحتفظ فيه بمعلومة معينة.'},
{q:'كم كانت نتيجة التنفيذ في مثال fish؟',a:'20 لأن 0 + 8 + 12 = 20.'}],
skills:['مفهوم المتغير','تعريف المتغير','تحديث قيمة المتغير','طباعة المتغير']},

/* ---- الدرس 5 ---- */
{id:'l5',u:'u2',icon:'🔀',title:'التفرع الشرطي (if)',
obj:['أفهم معنى التفرع الشرطي','أكتب شرط if مع المقارنة','أكتب else للحالة البديلة','أعرف متى يُنفذ else بالضبط'],
steps:[
{t:'<b>التفرع الشرطي:</b> يعني لو حصلت حاجة اعمل كده. مثلًا لو جبت في البرنامج 100% مصروف فهزيد.'},
{t:'<b>الموقف:</b> إذا حصلت على 100 في العلوم، وعندي أمي أن تعطيني مصروفًا إضافيًا — إزاي أكتبه في البرنامج؟'},
{t:'<b>الحالة الأولى: حصلت على 100 ✔</b>',c:'let science = 100;\nif (science == 100){\n  console.log("Increased allowance!");\n}',o:'Increased allowance!'},
{t:'النتيجة: لو حصلت على 100 هيكتب: Increased allowance!'},
{t:'<b>الحالة الثانية: حصلت على أقل من 100 ✖</b> — نضيف else للحالة الأخرى:',c:'let science = 80;\nif (science == 100){\n  console.log("Increased allowance!");\n} else {\n  console.log("Weeding the garden");\n}',o:'Weeding the garden'},
{t:'<b>ملاحظة:</b> else تُنفذ فقط عندما يكون الشرط في if غير صحيح.'},
{t:'<b>العمل داخل if أو else</b> يُكتب بين <span class="k">{ }</span> حتى لو كانت جملة واحدة.'}],
rules:['<span class="k">if (الشرط) { الكود }</span> — ينفذ الكود إذا تحقق الشرط.','<span class="k">else { الكود }</span> — يُنفذ عندما يكون شرط if غير صحيح.','نستخدم معاملات المقارنة (مثل ==) داخل الشرط.','الكود داخل if أو else يُكتب بين { } حتى لو كانت جملة واحدة.'],
ex:[
{t:'الحالة الأولى: science = 100',c:'let science = 100;\nif (science == 100){\n  console.log("Increased allowance!");\n}',o:'Increased allowance!',e:'الشرط science == 100 متحقق فيُنفذ كود if.'},
{t:'الحالة الثانية: science = 80',c:'let science = 80;\nif (science == 100){\n  console.log("Increased allowance!");\n} else {\n  console.log("Weeding the garden");\n}',o:'Weeding the garden',e:'الشرط غير متحقق فيُنفذ else ويطبع Weeding the garden.'}],
mis:['توقع تنفيذ else عندما يتحقق if — بل تُنفذ فقط عندما يكون شرط if غير صحيح.','نسيان الأقواس { } حول الكود.','الخلط بين = (إسناد قيمة) و == (مقارنة) داخل الشرط.'],
quick:[
{q:'متى يُنفذ كود else ؟',a:'فقط عندما يكون الشرط في if غير صحيح.'},
{q:'ماذا يطبع البرنامج عندما science = 80 في مثال الحالة الثانية؟',a:'Weeding the garden.'},
{q:'بين ماذا يوضع الكود داخل if ؟',a:'بين الأقواس { } حتى لو كانت جملة واحدة.'}],
skills:['مفهوم التفرع الشرطي','بنية if','شرط else','الأقواس { }']},

/* ---- الدرس 6 ---- */
{id:'l6',u:'u2',icon:'⚖️',title:'معاملات المقارنة و else if',
obj:['أحفظ معاملات المقارنة الخمسة','أستخدم >= و <= و > و < داخل الشروط','أستخدم else if لأكثر من شرط','أنتبه للفرق بين > و >= عند كتابة الشروط'],
steps:[
{t:'<b>المعاملات المقارنة:</b> يمكننا مقارنة قيمة A وقيمة B — وهذه هي معاملات المقارنة كما موضحة أمامك في الجدول:'},
{t:'<span class="k">A == B</span> تعني أن A تساوي B'},
{t:'<span class="k">A &gt; B</span> تعني أن A أكبر من B'},
{t:'<span class="k">A &lt; B</span> تعني أن A أصغر من B'},
{t:'<span class="k">A &gt;= B</span> تعني أن A أكبر من أو يساوي B'},
{t:'<span class="k">A &lt;= B</span> تعني أن A أصغر من أو يساوي B'},
{t:'<b>مثال 1:</b> إذا كانت قيمة word أكبر من أو تساوي 70 اخرج pass وإلا fail:',c:'let word = 60;\nif (word >= 70){\n  console.log("pass");\n} else {\n  console.log("fail");\n}',o:'fail',e2:'60 ليست أكبر أو تساوي 70 لذا سيتم تنفيذ else ويطبع fail.'},
{t:'<b>مثال 2:</b> إذا كانت قيمة height أكبر من 130 اخرج Can ride وإلا Cannot ride. مع height = 130: النتيجة Cannot ride — لأن 130 ليس أكبر من 130. <b>فكرة:</b> اجعل الشرط بسيطًا وسيعرف البرنامج ماذا يفعل.'},
{t:'<b>مثال:</b> إذا كانت قيمة age أكبر من أو يساوي 60 اخرج Can jump وإلا Cannot jump. مع age = 15: النتيجة Cannot jump.'},
{t:'<b>Else if في ثلاثة أسطر فقط:</b> هناك سباق جوائز — الجائزة الأولى دراجة جديدة، والجائزة الثانية اثنين من تذاكر الأكواريوم. كيف طريقة كتابتها؟',c:'let num = 2;\nif (num == 1){\n  console.log("New bicycle");\n} else if (num == 2){\n  console.log("Pair of tickets to the aquarium");\n}',o:'Pair of tickets to the aquarium'},
{t:'النتيجة: القيمة 2 ليست 1، لكنها تساوي 2 — لذا سيُنفذ else if ويطبع جائزة التذاكر. <b>فكرة:</b> يمكن استخدام else if لأكثر من شرط للاختيار.'},
{t:'<b>تذكر:</b> تستخدم <span class="k">&gt;=</span> للمقارنة من أن القيمة أكبر أو تساوي الحد المطلوب، والعامل <span class="k">&lt;=</span> يعني أصغر أو يساوي، و<span class="k">==</span> للمقارنة من أن القيمة تساوي قيمة أخرى.'}],
rules:['<span class="k">==</span> يساوي','<span class="k">&gt;</span> أكبر من','<span class="k">&lt;</span> أصغر من','<span class="k">&gt;=</span> أكبر من أو يساوي','<span class="k">&lt;=</span> أصغر من أو يساوي','else if تُستخدم عندما نحتاج أكثر من شرط للاختيار.'],
ex:[
{t:'مثال: المعامل >= مع word',c:'let word = 60;\nif (word >= 70){\n  console.log("pass");\n} else {\n  console.log("fail");\n}',o:'fail',e:'60 ليست أكبر أو تساوي 70 فنُفذ else.'},
{t:'مثال: المعامل > مع height',c:'let height = 130;\nif (height > 130){\n  console.log("Can ride");\n} else {\n  console.log("Cannot ride");\n}',o:'Cannot ride',e:'130 ليس أكبر من 130 فنُفذ else — انتبه للفرق بين > و >=.'},
{t:'مثال: else if مع num',c:'let num = 2;\nif (num == 1){\n  console.log("New bicycle");\n} else if (num == 2){\n  console.log("Pair of tickets to the aquarium");\n}',o:'Pair of tickets to the aquarium',e:'الشرط الأول فشل فانتقلنا لـ else if الذي تحقق.'}],
mis:['الخلط بين > و >= — فـ130 ليس أكبر من 130 لكنه يساويه.','الظن أن else if يُنفذ دائمًا — يُنفذ فقط إذا فشلت الشروط السابقة.','نسيان أن العامل <= يعني أصغر أو يساوي وليس أصغر فقط.'],
quick:[
{q:'ماذا تعني A >= B ؟',a:'تعني أن A أكبر من أو يساوي B.'},
{q:'هل نتيجة 130 > 130 صحيحة؟',a:'لا، 130 ليس أكبر من 130 لكنه يساويه — هنا نستخدم >=.'},
{q:'متى نستخدم else if ؟',a:'عندما نحتاج أكثر من شرط للاختيار.'}],
skills:['معاملات المقارنة','تنفيذ >=','تنفيذ >','else if']},

/* ---- الدرس 7 ---- */
{id:'l7',u:'u2',icon:'🎛️',title:'الشرطان معًا (&& و ||)',
obj:['أكتب تعبيرًا شرطيًا بشرطين باستخدام &&','أفهم أن && يتطلب تحقق الشرطين معًا','أستخدم || عندما يكفي شرط واحد','أعرف أسماء الرمزين & و |'],
steps:[
{t:'<b>كيفية كتابة التعبير الشرطي عندما يكون هناك شرطان؟</b> انظر المثال:',c:'let numberOfPeople = 3;\nlet fee = 3500;\nif (numberOfPeople >= 2 && fee >= 3000){\n  console.log("20% off");\n}'},
{t:'<b>ما هو رمز &؟</b> رمز & في عالم البرمجة يسمى <b>Ampersand</b>. إذا كتبنا Condition 1 && Condition 2 فهنا يعني الشرط الأول <b>والشرط الثاني</b> يجب أن يتحققا معًا.'},
{t:'<b>معلومة سريعة:</b> عندما نستخدم <span class="k">&&</span> يجب أن يكون الشرطان صحيحين في نفس الوقت.'},
{t:'<b>النتيجة:</b> لأن الشروط تحققت: 3 >= 2 ✔ و 3500 >= 3000 ✔ لذلك سيتم طباعة: 20% off.'},
{t:'<b>في سطر واحد فقط:</b> استخدم <b>Or</b> — الخط العمودي <span class="k">|</span> وهو رمز يسمى <b>Vertical bar</b>. كلمة Or تعني أن يتحقق شرط واحد على الأقل:',c:'if (numberOfPeople >= 2 || fee >= 3000){\n  console.log("10% off");\n}',o:'10% off'},
{t:'<b>تذكر:</b> <span class="k">||</span> هو رمز OR (أو) في عالم البرمجة. يكفي تحقق شرط واحد فقط ليكون الشرط كله صحيحًا.'},
{t:'<b>مثال:</b> أعلن المتغير age وأسند له قيمة 15. إذا كان أقل من أو يساوي 12 أو أكبر من أو يساوي 65 يخرج 30% off:',c:'let age = 15;\nif (age <= 12 || age >= 65){\n  console.log("30% off");\n}'},
{t:'<b>النتيجة:</b> لأن 15 ليست أقل من أو تساوي 12 وليست أكبر من أو يساوي 65، لن يتم تنفيذ الشرط ولن تظهر 30% off.'},
{t:'<b>المشغل ||</b> يُستخدم إذا أردت أن يتحقق شرط واحد على الأقل من الشرطين.'}],
rules:['<span class="k">Condition 1 && Condition 2</span> → يجب أن يتحقق الشرطان معًا.','<span class="k">Condition 1 || Condition 2</span> → يكفي تحقق شرط واحد على الأقل.','رمز & يسمى <b>Ampersand</b>، والخط العمودي | يسمى <b>Vertical bar</b>.','إذا كتبت "Condition 1 || Condition 2" فهذا يعني الشرط الأول أو الشرط الثاني.'],
ex:[
{t:'مثال && : خصم الشروط المتحققة معًا',c:'let numberOfPeople = 3;\nlet fee = 3500;\nif (numberOfPeople >= 2 && fee >= 3000){\n  console.log("20% off");\n}',o:'20% off',e:'الشرطان تحققا في نفس الوقت: 3 >= 2 ✔ و 3500 >= 3000 ✔.'},
{t:'مثال || : لا يتحقق أي شرط',c:'let age = 15;\nif (age <= 12 || age >= 65){\n  console.log("30% off");\n}',o:'(لا شيء)',e:'لا يتحقق أي شرط (15 ليست ≤ 12 وليست ≥ 65) فلا يطبع شيء.'},
{t:'مثال || : شرط واحد يكفي',c:'let numberOfPeople = 3;\nlet fee = 3500;\nif (numberOfPeople >= 2 || fee >= 3000){\n  console.log("30% off");\n}',o:'30% off',e:'numberOfPeople >= 2 ✔ و fee >= 3000 ✔ — يكفي تحقق واحد فتطبع 30% off.'}],
mis:['استخدام && معتقدًا أنه يكفي تحقق شرط واحد.','استخدام || معتقدًا أنه يجب تحقق الشرطين معًا.','نسيان فحص الشرطين كلاهما عند كتابة التعبير الشرطي المزدوج.'],
quick:[
{q:'ماذا يعني && ؟',a:'يعني أن الشرط الأول والثاني يجب أن يتحققا معًا.'},
{q:'ماذا يعني || ؟',a:'يكفي تحقق شرط واحد فقط ليكون الشرط كله صحيحًا.'},
{q:'ما اسم رمز & ؟',a:'يسمى Ampersand.'}],
skills:['المعامل &&','المعامل ||','رموز && و ||']},

/* ---- الدرس 8 ---- */
{id:'l8',u:'u3',icon:'🔁',title:'العملية التكرارية (for)',
obj:['أفهم معنى العملية التكرارية','أكتب حلقة for بأجزائها الثلاثة','أتحكم في عدد التكرارات','أستخدم الطريقة الأسهل i++'],
steps:[
{t:'<b>ماذا تعني العملية التكرارية؟</b> هي أنك تريد كتابة شيء عدة مرات، ولكن لم تكتبها بهذه الطريقة — لذلك لو تريد كتابة شيء 100 مرة سوف تحتاج يومًا كاملًا!'},
{t:'مثلًا لطباعة silk خمس مرات نكتب الأمر خمس مرات — لكن هناك كود أسهل بكثير والناتج سيكون نفس الكتابة السابقة.'},
{t:'<b>الكود السحري:</b>',c:'for (let count = 0; count < 10; count = count + 1) {\n  console.log("silk");\n}',o:'silk (10 مرات)'},
{t:'<b>النتيجة:</b> سوف يكتبها لك <b>10 مرات</b>! وأجزاء الحلقة الثلاثة:'},
{t:'1️⃣ <b>قيمة المتغير count</b> تبدأ من 0'},
{t:'2️⃣ <b>شرط التكرار:</b> ما دام أصغر من 10'},
{t:'3️⃣ <b>تحديث المتغير:</b> أضف 1 لقيمة المتغير في كل مرة'},
{t:'<b>تذكر:</b> حلقة for تكرر طالما الشرط صحيح.'},
{t:'<b>مثال 2:</b> اطبع لي كلمة Deer 10 مرات في وحدة التحكم بشرط أن يكون في 3 أسطر فقط:',c:"for (let count = 0; count < 10; count = count + 1){\n  console.log('deer');\n}"},
{t:'<b>شرح الإجراء:</b> الفاصلة المنقوطة <span class="k">;</span> تعني فاصل تفاصيل في البرنامج، لذلك يجب وضعها بين أجزاء البرنامج.'},
{t:'<b>طريقة أسهل!</b> يمكننا تسهيل الأمر أكثر عن طريق كتابة الكود بشكل أسهل:',c:"for (let i = 0; i < 10; i++){\n  console.log('genius');\n}"},
{t:'هذه الطريقة أسهل للكتابة والفهم. وإذا أردت أن يتكرر ثلاث مرات فقط، اكتب <span class="k">i &lt; 3</span> — ومن ذلك تفهم أنك تستطيع تغيير عدد التكرار بمجرد أن تغير الرقم فقط.'}],
rules:['<span class="k">for (البداية; الشرط; التحديث) { الكود }</span>','حلقة for تكرر طالما الشرط صحيح.','الفاصلة المنقوطة ; تفصل بين أجزاء الحلقة.','<span class="k">i++</span> اختصار أسهل لإضافة 1 في كل مرة.'],
ex:[
{t:'مثال: التكرار 10 مرات',c:'for (let count = 0; count < 10; count = count + 1) {\n  console.log("silk");\n}',o:'silk × 10',e:'يبدأ من 0 ويستمر طالما count < 10 أي 10 مرات.'},
{t:'مثال: 3 أسطر فقط',c:"for (let count = 0; count < 10; count = count + 1){\n  console.log('deer');\n}",o:'deer × 10',e:'حل من ثلاثة أسطر يطبع deer عشر مرات.'},
{t:'مثال: الطريقة الأسهل',c:"for (let i = 0; i < 10; i++){\n  console.log('genius');\n}",o:'genius × 10',e:'i++ اختصار لـ count = count + 1 وأسهل للكتابة والفهم.'}],
mis:['نسيان تحديث المتغير فلا تتوقف الحلقة أبدًا.','الالتباس بين < و <= في عدد التكرارات.','نسيان الفواصل المنقوطة بين أجزاء الحلقة.'],
quick:[
{q:'كم مرة يتكرر for (let i = 0; i < 10; i++) ؟',a:'10 مرات: من 0 إلى 9.'},
{q:'ماذا يعني i++ ؟',a:'اختصار أسهل يعني أضف 1 لقيمة المتغير في كل مرة.'},
{q:'متى تتوقف حلقة for ؟',a:'تتكرر طالما الشرط صحيح، وتتوقف عندما يصبح غير صحيح.'}],
skills:['مفهوم التكرار','حلقة for','عدد التكرارات','الطريقة الأسهل i++','الفاصلة المنقوطة']},

/* ---- الدرس 9 ---- */
{id:'l9',u:'u3',icon:'⚙️',title:'الدوال: الجاهزة والمخصصة',
obj:['أستخدم Math.round للتقريب','أستخدم Math.max و Math.min','أنتبه لحرف M الكبير','أنشئ دالة خاصة بكلمة function وأرجع النتيجة بـ return'],
steps:[
{t:'حتى الآن كنا نستخدم دوال جاهزة تقوم بالتقريب إلى أقرب عدد صحيح أو تخبرنا بالقيمة العظمى والصغرى. لكن يمكننا أن نقوم نحن بإنشاء دالة خاصة!'},
{t:'<b>مثال 3:</b> لو لديك رقم مثل 9.6 وتريد أن تقربه إلى 10:',c:'console.log(Math.round(9.6));',o:'10'},
{t:'<b>شرح الدالة:</b> احذر! حرف M لازم أن يُكتب <b>كبيرًا</b>. إذا كتبته صغيرًا فسوف يحدث خطأ.'},
{t:'<b>مثال 4:</b> كتابة دالة تخبرك بالقيمة العظمى — تكتب (Math.max):',c:'console.log(Math.max(5,10,50));',o:'50'},
{t:'<b>مثال 5:</b> كتابة دالة تخبرك بالقيمة الصغرى — تكتب (Math.min):',c:'console.log(Math.min(5,10,50));',o:'5'},
{t:'<b>تذكر:</b> دوال Math مفيدة جدًا في التعامل مع الأرقام. تأكد دائمًا من كتابة حرف M كبير لكي تعمل الدالة بشكل صحيح.'},
{t:'<b>إنشاء دوال خاصة بك:</b> يمكنك إنشاء دوال خاصة بك لأداء عمليات محددة تمامًا مثل الدوال الجاهزة (Math.min). يجب أن تبدأ دائمًا بكلمة <span class="k">function</span> لتعرف أنك هتنشئ دالة، ويتم اختيار اسم للدالة مثل min2 — وفي أسماء الدوال أو المتغيرات <b>لا يمكن استخدام المسافات</b>.'},
{t:'<b>دالة مخصصة: min2</b> — مثال min2(5,10):',c:'function min2(num1, num2) {\n  let result;\n  if (num1 < num2) {\n    result = num1;\n  } else {\n    result = num2;\n  }\n  return result;\n}'},
{t:'أجزاء الدالة: تحديد أسماء الدالة والوسيطات ← تحديد الإجراء الذي ستقوم به ← إرجاع قيمة النتيجة بـ <span class="k">return</span>.'},
{t:'<b>مثال تطبيقي:</b> أنا واثنين صحابي والحساب هيبقي 2800 — لو عايزين نقسم الحساب علينا نعملها إزاي بالدوال؟',c:'function split3(total) {\n  let result = total / 3;\n  return result;\n}\nconsole.log(split3(2800));',o:'933.33...'},
{t:'<b>شرح سريع للكود:</b> تستقبل الدالة قيمة واحدة (المجموع) ← تقسم القيمة على 3 ← ترجع الناتج (قيمة كل شخص). وهكذا عملنا الدالة وهيطلع لنا نصيب كل واحد وهو 933.'}],
rules:['<span class="k">Math.round()</span> تقرب إلى أقرب عدد صحيح.','<span class="k">Math.max()</span> تعيد القيمة العظمى، و<span class="k">Math.min()</span> تعيد القيمة الصغرى.','حرف M في Math يجب أن يُكتب كبيرًا دائمًا.','الدالة تبدأ بكلمة <span class="k">function</span> ثم اسمها والوسيطات ( ) ثم { الكود } و<span class="k">return</span> لإرجاع النتيجة.','لا يمكن استخدام المسافات في أسماء الدوال أو المتغيرات.'],
ex:[
{t:'مثال: التقريب',c:'console.log(Math.round(9.6));',o:'10',e:'Math.round قرّبت 9.6 إلى أقرب عدد صحيح.'},
{t:'مثال: القيمة العظمى والصغرى',c:'console.log(Math.max(5,10,50));\nconsole.log(Math.min(5,10,50));',o:'50\n5',e:'Math.max أعادت 50 و Math.min أعادت 5.'},
{t:'مثال تطبيقي: قسمة الحساب',c:'function split3(total) {\n  let result = total / 3;\n  return result;\n}\nconsole.log(split3(2800));',o:'933.33...',e:'الدالة تستقبل المجموع، تقسمه على 3، وترجع نصيب كل شخص (933).'}],
mis:['كتابة math بحرف صغير فلا تعمل الدالة بشكل صحيح.','نسيان return فلا تُرجع الدالة نتيجة.','وضع مسافة في اسم الدالة أو المتغير.'],
quick:[
{q:'ماذا تفعل Math.max(5,10,50) ؟',a:'تعيد القيمة العظمى وهي 50.'},
{q:'ما الذي يجب الانتباه له عند كتابة Math ؟',a:'حرف M يجب أن يُكتب كبيرًا وإلا حدث خطأ.'},
{q:'بأي كلمة نبدأ إنشاء دالة خاصة؟',a:'بكلمة function دائمًا.'}],
skills:['Math.round','Math.max و Math.min','حرف M الكبير','إنشاء دالة','return','الوسيطات','مثال تطبيقي split3']},

{id:'l10',u:'u4',icon:'✏️',title:'الأنواع والأقتباس',
obj:['أميّز بين كتابة الأرقام والنصوص','أكتب القيمة النصية بين اقتباس مزدوج','أفهم أن أي نص بين " " يعتبر نصًا وليس رقمًا'],
steps:[

{t:'<b>مثال (2):</b> اكتب الحروف بين اقتباس مزدوج ونقول بقيمة نصية أيضًا:',c:'let fee = "1000 codycoins";\nif (fee == "1000 codycoins") {\n  console.log("50 codycoins off");\n}',o:'50 codycoins off'},

{t:'<b>ملخص سريع:</b> ✅ الأرقام بدون اقتباس ✅ النصوص بين اقتباس مزدوج.'},
{t:'<b>نصيحة:</b> كلما استخدمت الاقتباس المزدوج للنصوص تجنبت الأخطاء في المقارنات.'}],
rules:['الأرقام تُكتب <b>بدون</b> اقتباس: <span class="k">let fee = 1000;</span>','النصوص تُكتب <b>بين</b> اقتباس مزدوج: <span class="k">let fee = "1000 codycoins";</span>','أي نص بين " " يعتبر نصًا وليس رقمًا.'],

{t:'مثال (2): مقارنة نصية',c:'let fee = "1000 codycoins";\nif (fee == "1000 codycoins") {\n  console.log("50 codycoins off");\n}',o:'50 codycoins off',e:'المقارنة بين نصين متطابقين تتحقق.'}],
mis:['كتابة الأرقام بين اقتباس فتصبح نصوصًا وتفشل المقارنات العددية.','نسيان الاقتباس حول النصوص.','الخلط بين الأرقام والنصوص في نفس المقارنة.'],
quick:[
{q:'كيف نكتب الأرقام؟',a:'بدون اقتباس.'},
{q:'كيف نكتب النصوص؟',a:'بين اقتباس مزدوج " ".'},
{q:'"1000" رقم أم نص؟',a:'نص، لأن أي نص بين " " يعتبر نصًا وليس رقمًا.'}],

{id:'l11',u:'u4',icon:'🔍',title:'أنواع البيانات و typeof والمقارنة',
obj:['أعرف الفرق بين سلسلة نصية string وقيمة عددية number','أستخدم typeof لتحديد النوع','أفهم الفرق بين == و ==='],
steps:[
{t:'<b>ما الفرق بين السطرين؟</b>'},
{t:'السطر الأول: مطبوع بعلامات اقتباس (يطبع سلسلة نصية string):',c:'console.log("1+1");',o:'1+1'},
{t:'السطر الثاني: ليس مطبوعًا بعلامات اقتباس (يطبع نتيجة حساب عددي numerical value):',c:'console.log(1+1);',o:'2'},
{t:'<b>تحديد النوع:</b> لو أنت مش متأكد وعايز الكمبيوتر هو اللي يقولك هي نصية ولا قيمة عددية، اكتب <span class="k">console.log(typeof ...)</span> — هذا الأمر يعيد نوع البيانات الموجودة داخل الأقواس.'},
{t:'<b>مثال 1:</b>',c:'console.log(typeof 100);',o:'number'},
{t:'number تعني أنها قيمة عدّية.'},
{t:'<b>مثال 2:</b>',c:'console.log(typeof "Hello");',o:'string'},
{t:'String تعني أنها سلسلة نصية. فهم الفرق بين السلاسل النصية والقيم العددية مهم جدًا في كتابة البرامج وتجنب الأخطاء.'},
{t:'<b>مقارنة القيم والأنواع:</b> هل الكمبيوتر يعرف الفرق بين القيمة العددية والسلسلة النصية؟ نعم! هو ممكن يقولك النتيجة صحيح ولا غلط:'},
{t:'المقارنة بعلامتين == (تقارن القيمة فقط):',c:'console.log(1 == "1");',o:'true'},
{t:'المقارنة بثلاث علامات === (أكثر صرامة — تقارن القيمة والنوع معًا):',c:'console.log(1 === "1");',o:'false'}],
rules:['<span class="k">typeof</span> يعيد نوع البيانات الموجودة داخل الأقواس.','number تعني قيمة عددية، وstring تعني سلسلة نصية.','<span class="k">1 == "1"</span> → true لأن == تقارن القيمة.','<span class="k">1 === "1"</span> → false لأن === تقارن القيمة والنوع معًا.'],
ex:[
{t:'مثال: النص مقابل الحساب',c:'console.log("1+1");\nconsole.log(1+1);',o:'1+1\n2',e:'بين الاقتباس تطبع كما هي، وبدون اقتباس تطبع نتيجة الحساب.'},
{t:'مثال: typeof مع رقم ونص',c:'console.log(typeof 100);\nconsole.log(typeof "Hello");',o:'number\nstring',e:'typeof يحدد نوع كل قيمة.'},
{t:'مثال: مقارنة القيم والأنواع',c:'console.log(1 == "1");\nconsole.log(1 === "1");',o:'true\nfalse',e:'== تقبل تطابق القيمة، أما === فتشترط تطابق القيمة والنوع.'}],
mis:['الظن أن "1+1" تطبع 2 — بل تطبع النص كما هو.','الخلط بين == و === في المقارنات.','الظن أن typeof يطبع القيمة نفسها — بل يطبع نوعها.'],
quick:[
{q:'ماذا يعيد typeof 100 ؟',a:'يعيد number لأنها قيمة عددية.'},
{q:'ماذا يعيد typeof "Hello" ؟',a:'يعيد string لأنها سلسلة نصية.'},
{q:'ما نتيجة 1 === "1" ؟',a:'false لأن القيمة أو النوع مختلف — === أكثر صرامة.'}],
skills:['الفرق بين النص والرقم','typeof','مقارنة القيم والأنواع']},

{id:'l12',u:'u4',icon:'🔄',title:'التحويل بين الأنواع (Number و NaN)',
obj:['أحوّل النص إلى قيمة عددية بـ Number()','أعرف معنى NaN ومتى تظهر','أميّز النصوص الرقمية التي تتحول بنجاح'],
steps:[
{t:'سأخبرك كيف تغيّر نوع البيانات. على سبيل المثال، النص "100" هو نص لكن يمكنك تغييره إلى قيمة عددية بكتابة برنامج مثل هذا:'},
{t:'<b>إلى قيمة عددية:</b>',c:'console.log(Number("100"));',o:'100'},
{t:'<b>نص آخر إلى قيمة عددية:</b>',c:'console.log(Number("Hello"));',o:'NaN'},
{t:'<b>ما هو NaN؟</b> NaN اختصار لـ <b>Not Number</b> وهذا يعني أنه لا يمكن تحويلها إلى قيمة عددية.'},
{t:'<b>هل تتذكر؟</b> NaN هي قيمة خاصة تُستخدم للتعبير عن عدم إمكانية التحويل إلى رقم.'},
{t:'<b>ملاحظة سريعة:</b> عندما نحول نصًا يبدو أنه رقم مثل "100" يتحول إلى رقم فعلي. أما النصوص التي ليست أرقامًا مثل "Hello" تصبح NaN.'}],
rules:['<span class="k">Number("نص")</span> تحوّل النص الرقمي إلى قيمة عددية.','<span class="k">NaN = Not Number</span> تعني تعذر التحويل إلى رقم.','النصوص الرقمية (مثل "100") تتحول بنجاح، والنصوص غير الرقمية (مثل "Hello") تصبح NaN.'],
ex:[
{t:'مثال: تحويل نص رقمي',c:'console.log(Number("100"));',o:'100',e:'النص الذي يبدو رقمًا يتحول إلى رقم فعلي.'},
{t:'مثال: تحويل نص غير رقمي',c:'console.log(Number("Hello"));',o:'NaN',e:'لا يمكن تحويل Hello لرقم فتظهر NaN دون إيقاف البرنامج.'}],
mis:['الظن أن Number("Hello") يعطي صفرًا أو يوقف البرنامج — بل يظهر NaN.','الظن أن "100" تبقى نصًا بعد التحويل.','نسيان الأقواس حول النص داخل Number.'],
quick:[
{q:'ما ناتج Number("100") ؟',a:'الرقم 100.'},
{q:'ما معنى NaN ؟',a:'Not Number — قيمة خاصة تعبر عن عدم إمكانية التحويل إلى رقم.'},
{q:'ما ناتج Number("Hello") ؟',a:'NaN لأن النص ليس رقمًا.'}],
skills:['التحويل إلى رقم','NaN']},

{id:'l13',u:'u5',icon:'🗃️',title:'المصفوفة والفهرس',
obj:['أفهم لماذا نستخدم المصفوفة','أنشئ مصفوفة في سطر واحد','أصل لعنصر عبر فهرسه','أعرف أن الفهرس يبدأ من 0'],
steps:[
{t:'<b>آخر درس في الترم الأول:</b> لنفرض أن درجات الحرارة منذ الأسبوع الماضي كانت: 28، 33، 36، 36، 36، 26، 27 — بدلًا من أن نكتبها هكذا:'},
{t:'<b>نستخدم متغيرات منفصلة:</b>',c:'let temp1 = 36;\nlet temp2 = 36;\nlet temp3 = 26;\nlet temp4 = 27;\nlet temp5 = 28;\nlet temp6 = 33;\nlet temp7 = 36;'},
{t:'<b>معلومة سريعة:</b> كل متغير يحتوي درجة واحدة فقط. لكن لو زادت الدرجات… سنعاني مع متغيرات كثيرة!'},
{t:'<b>أو نستخدم مصفوفة (سطر واحد):</b>',c:'let tempList = [36, 36, 26, 27, 28, 33, 36];',o:'كل الدرجات في مكان واحد!'},
{t:'<b>فكرة مهمة:</b> المصفوفة تساعدنا نكتب بيانات كثيرة بشكل مرتب ونسهل الوصول إليها وهي أساس كل أمثلة هذا الدرس!'},
{t:'إذا اعتبَرنا المتغير <b>"صندوقًا يحمل قيمة"</b> فإن المصفوفة هي <b>"مجموعة صناديق متشابهة معًا"</b>.'},
{t:'<b>مثال عملي:</b> لو أنت عايز تعرف درجة حرارة اليوم الخامس وهي 28 تكتبها إزاي؟',c:'let tempList = [36, 36, 26, 27, 28, 33, 36];\nconsole.log(tempList[4]);',o:'28'},
{t:'هتلاقي إني كنت كاتب 4 وعايز يطلع لي اليوم الخامس؟ هقولك: المصفوفة بتعد من 0 — <b>فهرس المصفوفة يبدأ من 0</b>: [0]=36 و[1]=36 و[2]=26 و[3]=27 و[4]=28 و[5]=33 و[6]=36.'},
{t:'<b>تذكر:</b> المصفوفة تشبه كتابًا كبيرًا من القيم المرتبة في سطر واحد والوصول لأي قيمة بسهولة! <b>معلومة إضافية:</b> المصفوفة تخزن بيانات من نفس النوع وتستخدم للوصول لأي قيمة عن طريق فهرسها.'}],
rules:['المصفوفة تُكتب بين <span class="k">[ ]</span> والعناصر مفصولة بفواصل.','الوصول للعنصر عبر فهرسه: <span class="k">tempList[رقم الفهرس]</span>.','فهرس المصفوفة يبدأ من <b>0</b> وليس من 1.','المصفوفة تخزن بيانات من نفس النوع.'],
ex:[
{t:'مثال عملي: درجة اليوم الخامس',c:'let tempList = [36, 36, 26, 27, 28, 33, 36];\nconsole.log(tempList[4]);',o:'28',e:'الفهرس [4] يعيد اليوم الخامس لأن العد يبدأ من 0.'},
{t:'مثال: أول عنصر',c:'console.log(tempList[0]);',o:'36',e:'الفهرس 0 يعيد أول عنصر في المصفوفة.'}],
mis:['الظن أن الفهرس يبدأ من 1 — بل يبدأ من 0.','استخدام فهرس خارج حدود المصفوفة.','نسيان الفواصل بين عناصر المصفوفة.'],
quick:[
{q:'من أي رقم يبدأ فهرس المصفوفة؟',a:'يبدأ من 0 وليس من 1.'},

{q:'إلى ماذا تشبه المصفوفة؟',a:'"مجموعة صناديق متشابهة معًا" في مقابل المتغير الذي هو صندوق واحد.'}],
skills:['مفهوم المصفوفة','تعريف المصفوفة','الفهرس']},

/* ---- الدرس 14 ---- */
{id:'l14',u:'u5',icon:'➕',title:'جمع عناصر المصفوفة و length',
obj:['أجمع عناصر المصفوفة بحلقة for','أحسب متوسط القيم','أستخدم length لمعرفة عدد العناصر'],
steps:[
{t:'<b>مثال 1:</b> أسند مصفوفة إلى متغير، اجمع كل درجات الحرارة للأسبوع، واقسم المجموع على أسبوع واحد (7 أيام).'},
{t:'<b>الحل:</b>',c:'let tempList = [36, 36, 26, 27, 28, 33, 36];\nlet total = 0;\nfor(let i = 0; i < 7; i++){\n  total = total + tempList[i];\n}\nconsole.log(total);',o:'222'},
{t:'<b>شرح سريع:</b> نبدأ المتغير total = 0 ثم نكرر على عناصر المصفوفة من الفهرس 0 إلى 6 (أي 7 عناصر) ونجمع كل قيمة فيها. النتيجة: مجموع درجات الحرارة للأسبوع = <b>222</b>.'},
{t:'<b>لو عايز نقسم المجموع على عدد الأيام</b> (7 أيام) عشان نعرف المتوسط:',c:'console.log(total / 7);',o:'31.71'},
{t:'المتوسط ≈ <b>31.71</b>.'},
{t:'<b>لو عايز تجيب طول المصفوفة</b> (عدد عناصرها):',c:'let tempList = [36, 36, 26, 27, 28, 33, 36, 30, 28, 29];\nconsole.log(tempList.length);',o:'10'},
{t:'طول المصفوفة = <b>10</b>.'},
{t:'<b>تذكر:</b> المصفوفة تخزن عدة قيم من نفس النوع • نستخدم الفهرس للوصول لأي عنصر • الفهرس يبدأ من 0 وليس من 1 • length ترجع عدد العناصر وليس آخر فهرس.'},
{t:'<b>معلومة مهمة:</b> خاصية length ترجع عدد عناصر المصفوفة دائمًا.'}],
rules:['<span class="k">let total = 0;</span> ثم داخل الحلقة: <span class="k">total = total + tempList[i];</span>','<span class="k">length</span> ترجع عدد عناصر المصفوفة دائمًا.','المتوسط = المجموع ÷ عدد العناصر.','آخر فهرس = الطول − 1 (لمصفوفة من 7 عناصر آخر فهرس هو 6).'],
ex:[
{t:'مثال: جمع درجات الأسبوع',c:'let tempList = [36, 36, 26, 27, 28, 33, 36];\nlet total = 0;\nfor(let i = 0; i < 7; i++){\n  total = total + tempList[i];\n}\nconsole.log(total);',o:'222',e:'نكرر على 7 عناصر (فهارس 0 إلى 6) ونجمع كل قيمة.'},
{t:'مثال: المتوسط',c:'console.log(total / 7);',o:'31.71',e:'قسمنا المجموع 222 على عدد الأيام 7.'},
{t:'مثال: طول المصفوفة',c:'let tempList = [36, 36, 26, 27, 28, 33, 36, 30, 28, 29];\nconsole.log(tempList.length);',o:'10',e:'length ترجع عدد العناصر = 10 وليس آخر فهرس (9).'}],
mis:['استخدام tempList[7] للوصول لآخر عنصر في مصفوفة من 7 عناصر — الفهرس الأخير هو 6.','الخلط بين length وآخر فهرس.','نسيان تصفير total = 0 قبل الحلقة.'],
quick:[
{q:'ماذا ترجع خاصية length ؟',a:'ترجع عدد عناصر المصفوفة دائمًا وليس آخر فهرس.'},

function newStudent(name){
 const s={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,created:Date.now(),xp:0,badges:[],lessons:{},exams:[],stats:{},certs:[]};
 DB.students.push(s);saveDB();return s;
}
const BADGES=[
{id:'first_read',icon:'🚀',name:'أول خطوة',desc:'أكملت أول شرح درس'},
{id:'reader',icon:'📚',name:'قارئ نهم',desc:'أكملت 5 شروح دروس'},
{id:'first_exam',icon:'🎯',name:'قناص الأسئلة',desc:'أكملت أول اختبار'},
{id:'perfect',icon:'💯',name:'الدرجة الكاملة',desc:'حصلت على 100% في أي اختبار'},
{id:'xp200',icon:'⚡',name:'سريع التعلم',desc:'وصلت إلى 200 نقطة'},
{id:'xp700',icon:'🛡️',name:'محترف صاعد',desc:'وصلت إلى 700 نقطة'},
{id:'exams10',icon:'🔥',name:'لا يتوقف',desc:'أكملت 10 اختبارات'},
{id:'final_pass',icon:'🏆',name:'بطل الترم',desc:'اجتزت الاختبار النهائي'}];
const LEVELS=[{n:'مبتدئ',i:'🌱',min:0},{n:'متعلم',i:'📘',min:150},{n:'متقدم',i:'⚡',min:350},{n:'محترف البرمجة',i:'🛡️',min:700},{n:'بطل البرمجة',i:'👑',min:1200}];
function levelOf(xp){let l=LEVELS[0];for(const L of LEVELS)if(xp>=L.min)l=L;return l}
function nextLevel(xp){return LEVELS.find(L=>L.min>xp)||null}
const MOTIV=['أحسنت! كل سطر تكتبه اليوم لبنة تبني مهاراتك 🌟','لا تخف من الأخطاء، فهي جزء طبيعي من التعلم وأهم طرق الوصول إلى الحل!','استمر في التجربة، اسأل، ابحث، وطور نفسك يومًا بعد يوم.','المستقبل سيكون لمن يجمع بين العلم والعمل والإبداع!','مارس كتابة الأكواد يوميًا حتى لو لوقت قصير — أنت تبني مستقبلك غدًا!','التجربة هي أفضل معلم — جرب تعديلات مختلفة وراقب النتيجة!'];

/* =============== دوال مساعدة على الطالب =============== */
function recordStat(qid,ok){const st=ME.stats[qid]||(ME.stats[qid]={r:0,w:0});ok?st.r++:st.w++}
function addXP(n){if(n<=0)return;const b=levelOf(ME.xp).n;ME.xp+=n;const a=levelOf(ME.xp);if(a.n!==b)setTimeout(()=>toast(`🎊 مبروك! ترقية إلى مستوى «${a.n}» ${a.i}`),600);checkBadges();saveDB()}
function readCount(){return LESSONS.filter(L=>ME.lessons[L.id]&&ME.lessons[L.id].read).length}
function examCount(){return ME.exams.length}
function avgPct(){if(!ME.exams.length)return 0;return Math.round(ME.exams.reduce((a,e)=>a+e.pct,0)/ME.exams.length)}
function doneLessons(){return LESSONS.filter(L=>ME.lessons[L.id]&&ME.lessons[L.id].exam!=null).length}
function checkBadges(){
 const g=id=>{if(!ME.badges.includes(id)){ME.badges.push(id);const b=BADGES.find(x=>x.id===id);setTimeout(()=>toast(`${b.icon} شارة جديدة: ${b.name}!`),900)}};
 if(readCount()>=1)g('first_read');
 if(readCount()>=5)g('reader');
 if(ME.exams.length>=1)g('first_exam');
 if(ME.exams.some(e=>e.pct===100))g('perfect');
 if(ME.xp>=200)g('xp200');
 if(ME.xp>=700)g('xp700');
 if(ME.exams.length>=10)g('exams10');
 if(ME.certs.length>=1)g('final_pass');
}
function getLessonQs(lid){
 let base=(QUESTIONS[lid]||[]).filter(q=>!DB.deleted.includes(q.id)).map(q=>DB.edited[q.id]?{...q,...DB.edited[q.id]}:q);
 return base.concat(DB.custom.filter(q=>q.lid===lid));
}
function findQ(qid){
 for(const L of LESSONS){const q=getLessonQs(L.id).find(x=>x.id===qid);if(q)return q}
 const q=getLessonQs('final').find(x=>x.id===qid);if(q)return q;
 return DB.custom.find(x=>x.id===qid)||null;
}

function go(name,data={}){VIEW={name,...(typeof data==='string'?{lid:data}:data)};window.scrollTo({top:0,behavior:'smooth'});render()}
function render(){renderTopbar();renderBottom();renderFooter();
 const app=$('#app');
 if(VIEW.name==='welcome')renderWelcome(app);
 else if(!ME){VIEW={name:'welcome'};renderWelcome(app);return}
 else if(VIEW.name==='home')renderHome(app);
 else if(VIEW.name==='lesson')renderLesson(app,VIEW.lid);
 else if(VIEW.name==='quiz')renderQuiz(app);
 else if(VIEW.name==='results')renderResults(app);
 else if(VIEW.name==='board')renderBoard(app);
 else if(VIEW.name==='certs')renderCerts(app);
 else if(VIEW.name==='admin')renderAdmin(app);
 else renderHome(app);
}

/* =============== محرك الاختبار =============== */
let QZ=null,RES=null;
function prepQ(q){
 if(q.t==='mcq'||q.t==='fill'){
  const m=q.opts.map((o,i)=>({o,i}));const sm=shuffle(m);
  return {...q,disp:sm.map(x=>x.o),corrIdx:sm.findIndex(x=>x.i===q.a)};
 }
 return q;
}
function startQuiz(mode,lid){
 let pool,n;
 if(mode==='final'){pool=LESSONS.reduce((a,L)=>a.concat(getLessonQs(L.id)),[]).concat(getLessonQs('final'));n=15}
 else{pool=getLessonQs(lid);n=mode==='practice'?6:10}
 if(pool.length<n)n=pool.length;
 if(!n){toast('لا توجد أسئلة متاحة لهذا الدرس');return}
 QZ={mode,lid,list:shuffle(pool).slice(0,n).map(prepQ),i:0,correct:0,oks:[],start:Date.now(),checked:false,cur:null,
  order:null,zones:null,free:null,sel:null,dragPos:null,dragChip:null};
 if(mode!=='practice')QZ.tid=setInterval(()=>{const el=$('#qt');if(el)el.textContent=fmtTime((Date.now()-QZ.start)/1000|0)},1000);
 go('quiz');
}
function exitQuiz(){
 if(!confirm('هل تريد الخروج من الاختبار؟ لن يتم حفظ النتيجة.'))return;
 if(QZ&&QZ.tid)clearInterval(QZ.tid);
 QZ=null;go('home');
}
function renderQuiz(app){
 if(!QZ){go('home');return}
 const q=QZ.list[QZ.i];
 const title=QZ.mode==='practice'?'تدريب الدرس':QZ.mode==='exam'?'اختبار الدرس':'الاختبار النهائي';
 const L=LESSONS.find(x=>x.id===QZ.lid);
 const dots=QZ.list.map((_,i)=>`<span class="${i<QZ.i?(QZ.oks[i]?'okd':'badd'):'on'}"></span>`).join('');
 app.innerHTML=`<div class="wrap fade" style="max-width:760px">
 <div class="crumb">${L?esc(L.title)+' ← ':''}<b style="color:var(--pur)">${title}</b></div>
 <div class="card pad">
  <div class="qhead"><span class="qtype">${TYPELAB[q.t]}</span>
   <span class="chip blue small">سؤال ${QZ.i+1} من ${QZ.list.length}</span>
   ${QZ.mode!=='practice'?`<span class="chip warn">${ic('clock')} <span id="qt">${fmtTime((Date.now()-QZ.start)/1000|0)}</span></span>`:''}
   <button class="btn sm danger" style="margin-inline-start:auto" onclick="exitQuiz()">خروج</button></div>
  <div class="qdots">${dots}</div>
  ${q.t!=='fill'?`<div class="qq2">${esc(q.q)}</div>`:''}
  ${q.c?`<div class="code">${esc(q.c)}</div>`:''}
  <div id="qbody">${qBodyHTML(q)}</div>
  <div id="qactions" class="row" style="margin-top:16px">
   <button id="qsubmit" class="btn pri" disabled onclick="submitQ()">تحقق من الإجابة</button>
  </div>
 </div></div>`;
 if(q.t==='order'){QZ.order=shuffle(q.opts.map((_,i)=>i));renderOrderList()}
 if(q.t==='match'){const n=q.opts.length;QZ.zones=Array(n).fill(null);QZ.free=shuffle(q.opts.map((_,i)=>i));QZ.sel=null;renderMatch()}
}
function enableSubmit(){const b=$('#qsubmit');if(b)b.disabled=false}
function qBodyHTML(q){
 if(q.t==='mcq')return `<div class="opts lockable">${q.disp.map((o,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${esc(o)}</button>`).join('')}</div>`;
 if(q.t==='fill')return `<div class="qq2" style="font-size:15.5px;font-weight:600">${esc(q.q).replace(/____/,`<span class="blank" id="blank">______</span>`)}</div><div class="chips lockable">${q.disp.map((o,i)=>`<button class="fchip" id="opt${i}" onclick="pick(${i})">${esc(o)}</button>`).join('')}</div>`;
 if(q.t==='tf')return `<div class="tfgrid lockable"><button class="tfbtn" id="tf1" onclick="pickTF(true)">✔ صح</button><button class="tfbtn" id="tf0" onclick="pickTF(false)">✖ خطأ</button></div>`;
 if(q.t==='input')return `<input id="qin" class="inp" placeholder="اكتب إجابتك هنا…" style="margin-top:8px" oninput="qinChanged()" onkeydown="if(event.key==='Enter')submitQ()" autocomplete="off">`;
 if(q.t==='order')return `<p class="small mut">رتّب الخطوات من الأعلى إلى الأسفل (استخدم الأسهم أو السحب):</p><div id="olist"></div>`;
 if(q.t==='match')return `<p class="small mut">اسحب كل بطاقة إلى مكانها الصحيح — أو اضغط البطاقة ثم المكان:</p><div id="matcharea"></div>`;
 return '';
}
window.pick=function(i){
 if(QZ.checked)return;QZ.cur=i;
 document.querySelectorAll('.opt,.fchip').forEach(e=>e.classList.remove('sel'));
 const el=$('#opt'+i);if(el)el.classList.add('sel');
 const bl=$('#blank');if(bl)bl.textContent=QZ.list[QZ.i].disp[i];
 enableSubmit();
};
window.pickTF=function(v){if(QZ.checked)return;QZ.cur=v;$('#tf1').classList.toggle('sel',v===true);$('#tf0').classList.toggle('sel',v===false);enableSubmit()};
window.qinChanged=function(){QZ.cur=$('#qin').value;if(QZ.cur.trim())enableSubmit();else $('#qsubmit').disabled=true};
function renderOrderList(){
 const q=QZ.list[QZ.i];
 $('#olist').innerHTML=QZ.order.map((oi,pos)=>`<div class="oitem" draggable="true" ondragstart="dstart(${pos})" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="ddrop(event,${pos})">
  <span class="onum">${pos+1}</span><span style="flex:1">${esc(q.opts[oi])}</span>
  <span class="obtns"><button title="أعلى" onclick="omove(${pos},-1)">▲</button><button title="أسفل" onclick="omove(${pos},1)">▼</button></span></div>`).join('');
 enableSubmit();
}
window.omove=function(pos,d){const c=QZ.order,np=pos+d;if(np<0||np>=c.length)return;[c[pos],c[np]]=[c[np],c[pos]];renderOrderList()};
window.dstart=function(pos){QZ.dragPos=pos;event.dataTransfer.setData('text/plain',pos)};
window.ddrop=function(ev,pos){ev.preventDefault();const from=QZ.dragPos;if(from==null||from===pos)return;const c=QZ.order;const[m]=c.splice(from,1);c.splice(pos,0,m);QZ.dragPos=null;renderOrderList()};
function renderMatch(){
 const q=QZ.list[QZ.i];
 const zones=q.opts.map((p,z)=>`<div class="mzone ${QZ.zones[z]!=null?(QZ.zones[z]===z?'ok':'bad'):''}" onclick="mzone(${z})">
  <span class="zlab">${esc(p[1])}:</span>${QZ.zones[z]!=null?`<span class="mchip ${QZ.checked?(QZ.zones[z]===z?'ok':'bad'):''}" onclick="event.stopPropagation();mchip(${QZ.zones[z]})">${esc(q.opts[QZ.zones[z]][0])}</span>`:'<span class="small mut">أفلت البطاقة هنا</span>'}</div>`).join('');
 const chips=QZ.free.map(ci=>`<span class="mchip ${QZ.sel===ci?'sel':''}" draggable="true" ondragstart="dstartChip(${ci})" onclick="mchip(${ci})">${esc(q.opts[ci][0])}</span>`).join('');
 $('#matcharea').innerHTML=zones+(QZ.free.length?`<div class="row" style="margin-top:10px;min-height:44px;border:2px dashed var(--line);border-radius:12px;padding:8px" ondragover="event.preventDefault()" ondrop="returnChip(event)">${chips}</div>`:'');
 enableSubmit();
}
window.dstartChip=function(ci){QZ.dragChip=ci;event.dataTransfer.setData('text/plain',ci)};
window.returnChip=function(ev){ev.preventDefault();const ci=QZ.dragChip;if(ci==null)return;if(QZ.checked)return;QZ.zones=QZ.zones.map(z=>z===ci?null:z);if(!QZ.free.includes(ci))QZ.free.push(ci);QZ.dragChip=null;renderMatch()};
window.mchip=function(ci){
 if(QZ.checked)return;
 const zi=QZ.zones.findIndex(z=>z===ci);
 if(zi>-1){QZ.zones[zi]=null;QZ.free.push(ci);QZ.sel=null}
 else QZ.sel=QZ.sel===ci?null:ci;
 renderMatch();
};
window.mzone=function(z){
 if(QZ.checked||QZ.sel==null)return;
 QZ.zones[z]=QZ.sel;QZ.free=QZ.free.filter(x=>x!==QZ.sel);QZ.sel=null;renderMatch();
};
function correctText(q){
 if(q.t==='mcq'||q.t==='fill')return q.disp[q.corrIdx];
 if(q.t==='tf')return q.a?'صح':'خطأ';
 if(q.t==='input')return q.a[0];
 if(q.t==='order')return q.opts.join(' ثم ');
 if(q.t==='match')return q.opts.map(p=>`${p[0]} = ${p[1]}`).join(' ، ');
 return '';
}
window.submitQ=function(){
 if(!QZ||QZ.checked)return;
 const q=QZ.list[QZ.i];
 if(q.t==='match'&&QZ.zones.some(z=>z===null)){toast('أكمل وضع جميع البطاقات أولًا');return}
 if(q.t==='input'&&(!QZ.cur||!String(QZ.cur).trim())){toast('اكتب إجابتك أولًا');return}
 if(['mcq','fill'].includes(q.t)&&QZ.cur==null)return;
 if(q.t==='tf'&&QZ.cur==null)return;
 let ok=false;
 if(q.t==='mcq'||q.t==='fill')ok=QZ.cur===q.corrIdx;
 else if(q.t==='tf')ok=QZ.cur===q.a;
 else if(q.t==='input')ok=q.a.map(norm).includes(norm(QZ.cur));
 else if(q.t==='order')ok=QZ.order.every((v,i)=>v===i);
 else if(q.t==='match')ok=QZ.zones.every((v,z)=>v===z);
 QZ.checked=true;QZ.oks.push(ok);recordStat(q.id,ok);if(ok)QZ.correct++;
 document.querySelectorAll('.lockable').forEach(e=>e.classList.add('lock'));
 if(q.t==='mcq'||q.t==='fill'){const c=$('#opt'+q.corrIdx);if(c)c.classList.add('ok');
  if(!ok&&QZ.cur!=null){const b=$('#opt'+QZ.cur);if(b)b.classList.add('bad')}}
 if(q.t==='tf'){$('#tf'+(q.a?1:0)).classList.add('ok');if(!ok)$('#tf'+(QZ.cur?1:0)).classList.add('bad')}
 if(q.t==='input'&&!ok){const el=$('#qin');if(el){el.style.borderColor='var(--bad)';el.style.background='var(--badbg)'}}
 if(q.t==='order'){renderOrderList();[...document.querySelectorAll('#olist .oitem')].forEach((el,i)=>el.classList.add(QZ.order[i]===i?'ok':'bad'))}
 if(q.t==='match')renderMatch();
 $('#qsubmit').style.display='none';
 const fb=document.createElement('div');
 fb.className='fb '+(ok?'ok':'bad');
 fb.innerHTML=`<b class="t1">${ok?'✔ أحسنت! إجابة صحيحة':'✖ إجابة غير صحيحة'}</b>
 ${ok?'':`<div class="corr">الإجابة الصحيحة: <b>${esc(correctText(q))}</b></div>`}
 <div>${esc(q.x)}</div><div class="fbxp">${ok?(QZ.mode==='practice'?'+4 XP':QZ.mode==='exam'?'+2 XP':'+5 XP'):'راجع الشرح وستنجح في المرة القادمة!'}</div>`;
 $('#qbody').after(fb);
 const last=QZ.i===QZ.list.length-1;
 $('#qactions').innerHTML=`<button class="btn pri" onclick="nextQ()">${last?'إنهاء وعرض النتيجة':'السؤال التالي'} ${ic('arrL')}</button>`;
};
window.nextQ=function(){
 QZ.i++;QZ.checked=false;QZ.cur=null;QZ.sel=null;QZ.dragPos=null;QZ.dragChip=null;
 if(QZ.i>=QZ.list.length)finishQuiz();else render();
};
function finishQuiz(){
 clearInterval(QZ.tid);
 const total=QZ.list.length,pct=Math.round(QZ.correct/total*100);
 const time=(Date.now()-QZ.start)/1000|0;
 const skills=[...new Set(QZ.list.filter((_,i)=>!QZ.oks[i]).map(q=>q.s))];
 let gained=0,cert=null;
 const L=ME.lessons[QZ.lid]||(ME.lessons[QZ.lid]={});
 if(QZ.mode==='practice'){gained=QZ.correct*4;L.practice=Math.max(L.practice||0,pct)}
 else if(QZ.mode==='exam'){gained=QZ.correct*2+(pct>=DB.settings.certPct?20:0);L.exam=Math.max(L.exam||0,pct);L.attempts=(L.attempts||0)+1;ME.exams.push({lid:QZ.lid,mode:QZ.mode,pct,correct:QZ.correct,total,time,skills,date:Date.now()})}
 else{gained=QZ.correct*5+(pct>=DB.settings.certPct?50:0);L.exam=Math.max(L.exam||0,pct);L.attempts=(L.attempts||0)+1;ME.exams.push({lid:QZ.lid,mode:QZ.mode,pct,correct:QZ.correct,total,time,skills,date:Date.now()});
  if(pct>=DB.settings.certPct){
   cert={no:'QUR-L1-'+Math.random().toString(36).slice(2,7).toUpperCase()+Date.now().toString(36).slice(-3).toUpperCase(),name:ME.name,pct,level:levelOf(ME.xp+gained).n,date:Date.now()};
   ME.certs.push(cert);
  }
 }
 const prevLevel=levelOf(ME.xp).n;
 ME.xp+=gained;const newLevel=levelOf(ME.xp);
 if(newLevel.n!==prevLevel)setTimeout(()=>toast(`🎊 مبروك! ترقية إلى مستوى «${newLevel.n}» ${newLevel.i}`),600);
 checkBadges();saveDB();
 RES={mode:QZ.mode,lid:QZ.lid,total,correct:QZ.correct,pct,time,skills,xp:gained,cert};
 QZ=null;renderTopbar();go('results');
 if(cert)setTimeout(()=>toast('🎓 مبروك! تم إصدار شهادتك الرقمية تلقائيًا'),800);
}

/* =============== النتائج =============== */
function renderResults(app){
 if(!RES){go('home');return}
 const C=2*Math.PI*52,off=C*(1-RES.pct/100);
 const msg=RES.pct>=90?'مذهل! أنت تفهم الكود بعمق 🌟':RES.pct>=70?'أحسنت! أنت على الطريق الصحيح':RES.pct>=50?'جيد — راجع المهارات المطلوبة وستتقدم':'لا بأس! الأخطاء جزء طبيعي من التعلم — أعد المحاولة';
 const L=LESSONS.find(x=>x.id===RES.lid);
 app.innerHTML=`<div class="wrap fade" style="max-width:700px">
 <div class="card pad center">
  <h2>${RES.mode==='practice'?'نتيجة التدريب':RES.mode==='exam'?'نتيجة اختبار الدرس':'نتيجة الاختبار النهائي'}</h2>
  <p class="small mut">${L?esc(L.title):'شامل لجميع الوحدات'}</p>
  <div class="ring" style="margin:16px auto">
   <svg width="130" height="130" viewBox="0 0 120 120">

 <div><label>النوع:</label><select id="ft" class="inp" style="width:160px" onchange="adminAddQ($('#flid').value,this.value)">${Object.entries(TYPELAB).map(([k,v])=>`<option value="${k}" ${t===k?'selected':''}>${v}</option>`).join('')}</select></div></div>`:''}
 <label>نص السؤال:</label><textarea id="fq" class="inp">${q?esc(q.q):''}</textarea>
 <label>كود مرفق (اختياري):</label><input id="fc" class="inp" dir="ltr" value="${q&&q.c?esc(q.c):''}">
 ${fields}
 <label>الشرح المختصر للإجابة:</label><textarea id="fx" class="inp">${q?esc(q.x):''}</textarea>
 <label>المهارة:</label><input id="fs" class="inp" value="${q?esc(q.s):''}">

window.adminAddQ=function(lid,t){qForm({t:t||'mcq',opts:[],a:0,x:'',s:'',q:''},lid||'l1')};
window.adminEditQ=function(qid){const q=findQ(qid);if(!q){toast('السؤال غير موجود');return}qForm(q)};
window.adminSaveQ=function(qid,isAdd){
 const g=id=>{const e=$(id);return e?e.value:''};
 const upd={q:g('#fq').trim(),c:g('#fc').trim()||undefined,x:g('#fx').trim(),s:g('#fs').trim()||'عام'};
 if(!upd.q){toast('اكتب نص السؤال');return}
 const t=isAdd?$('#ft').value:(findQ(qid)||{}).t||'mcq';
 if(t==='mcq'||t==='fill'){
  upd.opts=[0,1,2,3].map(i=>g('#fo'+i).trim()).filter(Boolean);
  const fa=document.querySelector('input[name="fa"]:checked');
  upd.a=fa?parseInt(fa.value):0;
  if(upd.opts.length<2){toast('أدخل خيارين على الأقل');return}
 }else if(t==='tf'){upd.a=g('#fa')==='true'}
 else if(t==='input'){upd.a=g('#fa').split(',').map(x=>x.trim()).filter(Boolean)}
 else if(t==='order'){upd.opts=g('#fa').split('\n').map(x=>x.trim()).filter(Boolean);upd.a=null}
 else if(t==='match'){upd.opts=g('#fa').split('\n').map(l=>l.trim().split('=').map(x=>x.trim())).filter(p=>p.length===2&&p[0]&&p[1]);upd.a=null}
 if(isAdd){
  DB.custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),lid:$('#flid').value,t,...upd});
  toast('تمت إضافة السؤال بنجاح');
 }else{
  if(qid.startsWith('c')){const c=DB.custom.find(x=>x.id===qid);if(c)Object.assign(c,upd)}
  else DB.edited[qid]=upd;
  toast('تم حفظ التعديل');
 }
 saveDB();closeModal();go('admin',{tab:'questions'});
};
window.adminDelQ=function(qid){
 if(!confirm('حذف هذا السؤال نهائيًا؟'))return;
 const i=DB.custom.findIndex(x=>x.id===qid);
 if(i>-1)DB.custom.splice(i,1);else DB.deleted.push(qid);
 saveDB();go('admin',{tab:'questions'});toast('تم حذف السؤال');
};

 <button class="btn pri" onclick="saveSettings()">حفظ الإعدادات</button></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
 <b style="font-family:Cairo">تصدير البيانات:</b>
 <div class="row" style="margin-top:10px">
  <button class="btn ghost" onclick="exportExcel()">${ic('download')} تصدير Excel (كل البيانات)</button>
  <button class="btn ghost" onclick="exportCSV('students')">${ic('download')} CSV الطلاب</button>
  <button class="btn ghost" onclick="exportCSV('results')">${ic('download')} CSV النتائج</button>
 </div>
 <p class="small mut" style="margin-top:8px">تُحفظ كل البيانات بشكل دائم في قاعدة البيانات المحلية للمتصفح (طبقة تخزين منظمة وآمنة داخل التطبيق).</p>`;
}
window.saveSettings=function(){
 const p=parseInt($('#certPct').value);if(p>=50&&p<=95)DB.settings.certPct=p;
 const pin=$('#npin').value.trim();if(pin.length>=4)DB.settings.pin=pin;
 saveDB();toast('تم حفظ الإعدادات');go('admin',{tab:'settings'});
};
function dl(name,content,mime){const b=new Blob(['\ufeff'+content],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function studentsCSV(){return 'الاسم,النقاط,المستوى,الدروس المكتملة,عدد الاختبارات,متوسط الدرجات\n'+DB.students.map(s=>`${s.name},${s.xp},${levelOf(s.xp).n},${doneOf(s)},${s.exams.length},${avgOf(s)}%`).join('\n')}
function resultsCSV(){let r='الطالب,الاختبار,الدرجة,الصحيح,الإجمالي,الزمن,التاريخ\n';DB.students.forEach(s=>s.exams.forEach(e=>{r+=`${s.name},${e.mode==='final'?'الاختبار النهائي':lessonTitle(e.lid)},${e.pct}%,${e.correct},${e.total},${fmtTime(e.time)},${new Date(e.date).toLocaleString('ar-EG')}\n`}));return r}
window.exportCSV=function(w){dl(w==='students'?'qur-students.csv':'qur-results.csv',w==='students'?studentsCSV():resultsCSV(),'text/csv');toast('تم تصدير الملف CSV')};
window.exportExcel=function(){
 const t1=studentsCSV().replace(/,/g,'</td><td>'),t2=resultsCSV().replace(/,/g,'</td><td>');
 const html=`<html><head><meta charset="utf-8"></head><body dir="rtl"><h3>الطلاب</h3><table border="1"><tr><td>${t1.split('\n').slice(1).join('</td></tr><tr><td>')}</table><h3>النتائج</h3><table border="1"><tr><td>${t2.split('\n').slice(1).join('</td></tr><tr><td>')}</table></body></html>`;
 dl('qur-report.xls',html,'application/vnd.ms-excel');toast('تم تصدير ملف Excel');
};

/* =============== التشغيل =============== */
loadDB();
const sesId=localStorage.getItem(SESKEY);
ME=sesId?DB.students.find(s=>s.id===sesId):null;
render();
</script>
</body>
